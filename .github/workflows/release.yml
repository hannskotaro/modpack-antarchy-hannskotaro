name: Release Modpack

on:
  push:
    branches: [main]
    paths:
      - 'Antarchy-RPG-*.mrpack'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('modrinth.index.json'))['versionId'])")
          MRPACK=$(ls Antarchy-RPG-*.mrpack | head -n 1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}.${{ github.run_number }}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$TAG" "$MRPACK" \
            --title "Antarchy RPG $TAG" \
            --notes "Build automático do modpack ($MRPACK - commit $SHORT_SHA)." \
            --latest
